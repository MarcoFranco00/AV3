<!DOCTYPE html>
<html lang="pt-br">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Receitas - CoffeeLab</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand" href="index.html">☕ CoffeeLab</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                        <li class="nav-item"><a class="nav-link" href="metodos.html">Métodos</a></li>
                        <li class="nav-item"><a class="nav-link active" href="receitas.html">Receitas</a></li>
                        <li class="nav-item"><a class="nav-link" href="calculadora.html">Calculadora</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container mt-5">
            <h1 class="text-center mb-4">Minhas receitas</h1>
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card caixa shadow">
                        <div class="card-body">
                            <h5 class="mb-3">Nova receita</h5>
                            <label for="nome" class="form-label">Nome:</label>
                            <input type="text" id="nome" class="form-control mb-3" placeholder="Ex: Café gelado">
                            <label for="metodo" class="form-label">Método:</label>
                            <select id="metodo" class="form-select mb-3">
                                <option>V60</option>
                                <option>Prensa Francesa</option>
                                <option>AeroPress</option>
                                <option>Moka</option>
                            </select>
                            <label for="preparo" class="form-label">Ingredientes e preparo:</label>
                            <textarea id="preparo" class="form-control mb-3" rows="4"></textarea>
                            <div id="aviso" class="text-danger mb-2">
                            </div>
                            <button class="btn btn-cafe w-100" onclick="adicionarReceita()">Salvar receita</button>
                        </div>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="row g-3" id="lista-receitas">
                    </div>
                </div>
            </div>
        </main>

        <footer class="text-center py-4 mt-5">CoffeeLab • Projeto A3 - Usabilidade Web</footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/receitas.js"></script>
    </body>
</html>
