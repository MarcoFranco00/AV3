        <title>Métodos - CoffeeLab</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>
   
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand" href="index.html">☕ CoffeeLab</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item"><a class="nav-link" href="calculadora.html">Calculadora</a></li>
                    </ul>
                </div>
            </div>

        <main class="container mt-5">
            <h1 class="text-center mb-2">Métodos de preparo</h1>

            <div class="row g-4" id="lista-metodos">

        <div class="modal fade" id="modalMetodo" tabindex="-1">

                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modal-titulo"></h5>

                    </div>
                    <div class="modal-body">

                        <ol id="modal-passos"></ol>
                    </div>
                    <div class="modal-footer">
